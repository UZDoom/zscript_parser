[package]
authors = ["Gutawer"]
edition = "2021"
name = "zscript_parser"
version = "0.2.0"
license = "MIT"
description = "A parser for GZDoom ZScript"

[dependencies]
once_cell = "1.9.0"
rayon = { version = "1.5.1", optional = true }
str-utils = "0.1.5"
unicode-width = "0.1.9"
vec1 = "1.8.0"
walkdir = { version = "2.3.2", optional = true }
parking_lot = "0.11.2"
serde = { version = "1.0.133", features = ["derive"], optional = true }
bitflags = "1.3.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
parking_lot = { version = "0.11.2", features = ["wasm-bindgen"] }

[features]
default = []
serialize = ["serde", "vec1/serde"]
multithreaded = ["rayon"]
gzd_folder_filesystem = ["walkdir"]
